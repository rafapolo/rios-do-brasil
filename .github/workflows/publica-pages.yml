name: Publica no GitHub Pages

# O site é um arquivo só, já construído: não há build, só o upload. É
# independente do deploy no rodado (publica-roda.yml) — os dois saem do mesmo
# push, cada um para o seu endereço. Ativar em Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separa o que vai ao ar
        run: |
          mkdir -p site
          cp index.html site/
          cp screenshot.png site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
