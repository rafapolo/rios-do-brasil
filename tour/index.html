<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour dos rios do Brasil</title>
<meta name="robots" content="noindex">
<!-- Só leva ao mapa com o tour pedido: não duplica os 17 MB. Por file:// "../" é uma pasta e não abre
     o index.html, então o endereço leva o nome do arquivo; os parâmetros que vierem (?rapido=…) seguem. -->
<noscript><meta http-equiv="refresh" content="0; url=../index.html?tour=1"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05090b; color: #eef4f6;
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #9ec5f4; font-weight: 600; }
</style>
</head>
<body>
<p>Abrindo o tour dos rios do Brasil… <a href="../index.html?tour=1">Se não abrir, toque aqui.</a></p>
<script>
  var extra = new URLSearchParams(location.search);
  if (extra.get('tour') !== 'en') extra.set('tour', '1');   // /tour/?tour=en segue em inglês
  location.replace('../index.html?' + extra.toString());
</script>
</body>
</html>
